name: Publish Crate

on:
  release:
    types: [created]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: release-plz
        uses: release-plz/action@v0.5.117
        with:
            command: release
        env: 
          GITHUB_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}